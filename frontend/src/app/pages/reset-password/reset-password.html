<div class="auth-page">
  <div class="auth-card">
    <h1>Restablecer contraseña</h1>
    <p class="muted">Escriba la nueva contraseña. Las sesiones abiertas se cerrarán.</p>

    <form (ngSubmit)="reset()">
      <div class="field">
        <label for="token">Token del enlace</label>
        <input id="token" name="token" [(ngModel)]="token" />
        <span class="hint">Se llena solo si abrió el enlace del correo.</span>
      </div>
      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="password-confirmation">Confirmar contraseña</label>
        <input
          id="password-confirmation"
          type="password"
          name="passwordConfirmation"
          [(ngModel)]="passwordConfirmation"
          autocomplete="new-password"
        />
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Guardando...' : 'Restablecer' }}
      </button>
    </form>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }
    <div class="auth-links">
      <a routerLink="/login">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
