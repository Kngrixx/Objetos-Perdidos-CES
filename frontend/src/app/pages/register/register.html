<div class="auth-page">
  <div class="auth-card">
    <h1>Crear cuenta</h1>
    <p class="muted">Las cuentas nuevas quedan con rol CONSULTA.</p>

    <form (ngSubmit)="register()">
      <div class="field">
        <label for="identification">Identificación</label>
        <input id="identification" name="identification" [(ngModel)]="identification" maxlength="50" />
      </div>
      <div class="field">
        <label for="full-name">Nombre completo</label>
        <input id="full-name" name="fullName" [(ngModel)]="fullName" maxlength="150" />
      </div>
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" maxlength="200" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" autocomplete="new-password" />
        <span class="hint">Mínimo 8 caracteres, con letras y números.</span>
      </div>
      <div class="field">
        <label for="password-confirmation">Confirmar contraseña</label>
        <input
          id="password-confirmation"
          type="password"
          name="passwordConfirmation"
          [(ngModel)]="passwordConfirmation"
          autocomplete="new-password"
        />
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creando...' : 'Crear cuenta' }}
      </button>
    </form>

    @if (message()) {
      <div class="alert alert-error">{{ message() }}</div>
    }
    <div class="auth-links">
      <a routerLink="/login">Ya tengo cuenta</a>
    </div>
  </div>
</div>
