<div class="auth-page">
  <div class="auth-card">
    <h1>Objetos perdidos</h1>
    <p class="muted">Universidad CES · Iniciar sesión</p>

    @if (info()) {
      <div class="alert alert-info">{{ info() }}</div>
    }

    <form (ngSubmit)="login()">
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    @if (message()) {
      <div class="alert alert-error">{{ message() }}</div>
    }

    <div class="auth-links">
      <a routerLink="/register">Crear una cuenta</a>
      <a routerLink="/forgot-password">Olvidé mi contraseña</a>
    </div>
  </div>
</div>
